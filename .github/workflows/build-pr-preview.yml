name: Build & Preview PR


env:
  TZ: America/Sao_Paulo
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '.all-contributorsrc'
      - '.github/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate Roq Site
        uses: quarkiverse/quarkus-roq@v1
        with:
          java-version: 21
          # No GitHub Pages lookup/upload here: it would need a token, and the
          # preview is served from Surge anyway.
          github-pages: 'false'
          site-url: https://quarkusclub-blog-pr-${{ github.event.pull_request.number }}-preview.surge.sh
        env:
          QUARKUS_ROQ_GENERATOR_BATCH: true

      - name: Upload generated site
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-site
          path: target/roq
          if-no-files-found: error
          retention-days: 1
