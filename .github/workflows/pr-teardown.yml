name: Preview Teardown

on:
  pull_request_target:
    types: [closed]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-teardown:
    runs-on: ubuntu-latest
    steps:
      - name: Install Surge
        run: npm install surge

      - name: Teardown surge previews
        id: teardown
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          # Ask Surge which preview domains exist for this PR (the "latest" one
          # and the commit-pinned ones) instead of guessing. PRs that only touch
          # paths ignored by the preview build (e.g. .github/**) have none, and
          # that is not an error. A failing "surge list" (e.g. bad token) or a
          # failing teardown of a domain that does exist still fails the job.
          list=$(npx surge list --token "$SURGE_TOKEN")
          domains=$(printf '%s\n' "$list" \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -oE "quarkusclub-blog-pr-${PR_NUMBER}(-[0-9a-f]{7})?-preview\.surge\.sh" \
            | sort -u || true)

          if [ -z "$domains" ]; then
            echo "::notice::No preview to tear down for PR #${PR_NUMBER}."
            exit 0
          fi

          failed=0
          for domain in $domains; do
            echo "Tearing down $domain"
            npx surge teardown "$domain" --token "$SURGE_TOKEN" || failed=1
          done
          echo "removed=true" >> "$GITHUB_OUTPUT"
          exit "$failed"

      - name: Update PR status comment
        if: steps.teardown.outputs.removed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- Sticky Pull Request Comment -->';
            const body = `${marker}

            🙈 The PR is closed and the preview is expired.
            `;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.number }},
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ github.event.number }},
                body,
              });
            }
