{#if page.paginator && page.paginator.total > 1}
<nav class="flex items-center justify-center gap-4 sm:gap-6" role="navigation" aria-label="Pagination">
  {#if page.paginator.previous}
  <a href="{page.paginator.previous}" rel="prev" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg border border-border bg-surface-1 text-text-primary font-semibold text-sm sm:text-base hover:border-brand-red hover:text-brand-red transition-colors group">
    <i class="fas fa-arrow-left text-xs group-hover:-translate-x-1 transition-transform" aria-hidden="true"></i>
    Previous
  </a>
  {/if}

  <span class="text-sm sm:text-base text-text-muted">Page {page.paginator.currentIndex} of {page.paginator.total}</span>

  {#if page.paginator.next}
  <a href="{page.paginator.next}" rel="next" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg border border-border bg-surface-1 text-text-primary font-semibold text-sm sm:text-base hover:border-brand-red hover:text-brand-red transition-colors group">
    Next
    <i class="fas fa-arrow-right text-xs group-hover:translate-x-1 transition-transform" aria-hidden="true"></i>
  </a>
  {/if}
</nav>
{/if}
